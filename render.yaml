services:
  - type: web
    name: vigintiunus
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_WS_URL
        value: https://vigintiunus.onrender.com
