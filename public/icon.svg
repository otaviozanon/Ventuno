<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Chip base (gold) -->
  <circle cx="50" cy="50" r="45" fill="#d4af37"/>
  
  <!-- Chip border (dark) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Inner circle (dark felt green) -->
  <circle cx="50" cy="50" r="38" fill="#0a4d3c"/>
  
  <!-- Chip details (gold stripes) -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#d4af37" stroke-width="3" stroke-dasharray="8,5"/>
  
  <!-- "21" text -->
  <text x="50" y="60" font-family="serif" font-size="32" font-weight="bold" fill="#f4d03f" text-anchor="middle" dominant-baseline="middle">21</text>
  
  <!-- Highlight -->
  <circle cx="35" cy="35" r="8" fill="#f4d03f" opacity="0.3"/>
</svg>
